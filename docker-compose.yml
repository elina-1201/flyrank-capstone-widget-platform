services:
  db:
    image: postgres:17-alpine
    container_name: embedded-widget-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: embedded_widget
    ports:
      # Bind to loopback only — local dev DB, never exposed on the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
