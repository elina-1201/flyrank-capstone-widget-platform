services:
  db:
    image: postgres:17-alpine
    container_name: embedded-widget-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: embedded_widget
    ports:
      # Bind to loopback only — local dev DB, never exposed on the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-boot init: creates the dedicated e2e test database. Runs only when
      # the data volume is empty; see db-init/01-create-test-db.sql.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d embedded_widget"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: embedded-widget-mailpit
    restart: unless-stopped
    ports:
      # SMTP — the app's nodemailer transport.
      - "127.0.0.1:1025:1025"
      # Web UI — read caught mail at http://localhost:8025.
      - "127.0.0.1:8025:8025"

  api:
    build: .
    container_name: embedded-widget-api
    restart: unless-stopped
    # All config comes from .env; the two host-specific values are overridden
    # below to the compose service names (the app talks to db/mailpit over the
    # compose network, not localhost).
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/embedded_widget
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
